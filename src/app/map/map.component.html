<div class="header-container">
  <h1 class="welcome-header">Welcome Layth,</h1>
</div>

<div class="content-container">
  <div class="map-container">
    <div class="place-picker-container">
      <nz-form-item>
        <nz-form-control>
          <input nz-input id="location-input" placeholder="Enter a place to start" [formControl]="originControl">
        </nz-form-control>
      </nz-form-item>
    </div>
    <div id="map"></div>
  </div>

  <div class="locations-container">
    <nz-space nzDirection="vertical" nzSize="large">
      <div class="top-locations">
        <h2>Top 10 Locations</h2>
        <nz-list [nzDataSource]="stores.slice(0, 10)" [nzRenderItem]="store" [nzItemLayout]="'horizontal'">
          <ng-template #store let-store>
            <nz-list-item>
              <nz-list-item-meta nzTitle="{{ store.storeName }}"
                nzDescription="Address: {{ store.address }} | Distance: {{ store.distance }} | Duration: {{ store.duration }}">
              </nz-list-item-meta>
            </nz-list-item>
          </ng-template>
        </nz-list>
      </div>
      <div class="other-locations">
        <h2>Other Locations</h2>
        <div class="scrollable-list">
          <nz-space nzDirection="vertical" nzSize="middle">
            <nz-card *ngFor="let store of stores.slice(10)">
              <nz-card-meta nzTitle="{{ store.storeName }}"
                nzDescription="Address: {{ store.address }} | Distance: {{ store.distance }} | Duration: {{ store.duration }}">
              </nz-card-meta>
            </nz-card>
          </nz-space>
        </div>
      </div>
    </nz-space>
  </div>
</div>
