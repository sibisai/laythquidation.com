<div class="header-container">
  <h1 class="welcome-header">Welcome Layth,</h1>
</div>

<div class="map-container">
  <div class="place-picker-container">
    <mat-form-field>
      <input matInput id="location-input" placeholder="Enter a place to start" [formControl]="originControl">
    </mat-form-field>
  </div>
  <div id="map"></div>
</div>

<mat-card *ngFor="let store of stores">
  <mat-card-title>{{ store.storeName }}</mat-card-title>
  <mat-card-content>
    <p>Address: {{ store.address }}</p>
    <p>Distance: {{ store.distance }}</p>
    <p>Duration: {{ store.duration }}</p>
  </mat-card-content>
</mat-card>
