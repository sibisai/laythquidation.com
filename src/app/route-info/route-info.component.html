<div class="header-container">
  <h1 class="welcome-header">Total Duration: {{ tripInfo.totalDuration }}, Distance: {{ tripInfo.totalDistance }}</h1>
</div>
<div class="content-container">
  <div class="map-container">
    <div id="map"></div>
  </div>
  <div class="button-container">
    <button nz-button nzType="primary" (click)="viewInGoogleMaps()">View in Maps</button>
    <!-- <button nz-button nzType="default" (click)="toggleQRCode()">{{ showQRCode ? 'Hide' : 'Show' }} QR Code</button> -->
    <img *ngIf="showQRCode" [src]="generateQRCodeURL(tripInfo.googleMapsUrl)" alt="QR Code">
  </div>
</div>
