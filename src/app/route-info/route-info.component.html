<div class="header-container">
  <h1 class="welcome-header">{{ tripInfo.totalDuration }} | {{ tripInfo.totalDistance }}</h1>
</div>
<div class="content-container">
  <div class="map-container">
    <div id="map"></div>
  </div>
  <div class="button-container">
    <button nz-button nzType="primary" (click)="viewInGoogleMaps()">View in Maps</button>
  </div>
  <div class="qr-code-container">
    <img [src]="qrCodeUrl" alt="QR Code" style="width: 300px; height: 300px; margin-top: 20px; margin-bottom: 20px;">
  </div>
</div>
