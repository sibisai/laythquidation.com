<h1 nz-modal-title>Location Access Required</h1>
<div nz-modal-content>
  <p>Proceeding will use Los Angeles, CA as your location if you do not allow location access.</p>
</div>
<div nz-modal-footer>
  <button nz-button nzType="default" (click)="onClose()">Cancel</button>
  <button nz-button nzType="primary" (click)="onConfirm()">Proceed</button>
</div>
