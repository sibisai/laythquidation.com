<div class="location-selection-container">
  <div class="map-container">
    <div id="map"></div>
  </div>

  <div class="locations-overlay-container">
    <div class="header-container">
      <h1 class="location-header">Locations Selected: {{ selectedLocationsCount }}</h1>

      <nz-space *ngIf="!loading && selectedLocationsCount > 0" class="header-buttons">
        <button nz-button nzType="default" (click)="clearAllSelections()">Clear All</button>
        <button nz-button nzType="primary" (click)="submitSelections()" [nzLoading]="loading">Generate</button>
      </nz-space>

      <!-- Progress bar shown during route generation -->
      <nz-progress *ngIf="loading" nzSize="small" [nzPercent]="progress"
        [nzStatus]="progress === 100 ? 'success' : 'active'" [nzFormat]="progress === 100 ? formatDone : undefined"
        style="width: 100%; display: block; padding-right: 12px;">
      </nz-progress>

      <nz-divider nzPlain nzText="Showing {{ filteredLocations.length }} of 297 locations"
        class="custom-divider"></nz-divider>

      <div class="location-cards-container">
        <nz-space nzDirection="vertical" [nzSize]="8">
          <div class="slider-container">
            <nz-slider [(ngModel)]="selectedRadius" [nzMax]="maxRadius"
              (ngModelChange)="filterLocationsByRadius()"></nz-slider>
            <p>Within: {{ selectedRadius }} miles</p>
          </div>

          <div class="filter-container">
            <nz-input-group [nzSuffix]="inputClearTpl">
              <input type="text" nz-input nzBorderless placeholder="Search locations" [(ngModel)]="searchTerm"
                (input)="filterLocations()" />
            </nz-input-group>
            <ng-template #inputClearTpl>
              <span *ngIf="searchTerm" nz-icon nzType="close-circle" nzTheme="fill" (click)="clearSearch()"></span>
            </ng-template>
          </div>
        </nz-space>
      </div>
      <!-- Show skeletons while loading -->
      <div *ngIf="searchLoading" class="spin-container">
        <nz-spin nzSize="large"></nz-spin>
      </div>
      
      <!-- Show "No locations found" if the filtered array is empty and not loading -->
      <div *ngIf="!searchLoading && filteredLocations.length === 0" class="no-locations-found">
        No locations found.
      </div>

      <!-- Accordion with ghost mode -->
      <nz-collapse nzAccordion nzGhost>
        <nz-collapse-panel *ngFor="let location of filteredLocations; let i = index"
          [nzHeader]="(i + 1) + '. ' + location.storeName" [nzActive]="false"
          [ngClass]="{'selected-accordion': selectedLocationIndices.has(location.address)}" [nzExtra]="extraTemplate">

          <!-- Button template inside the panel -->
          <ng-template #extraTemplate>
            <button nz-button nzType="primary" [nzDanger]="selectedLocationIndices.has(location.address)"
              (click)="toggleSelection(location)">
              {{ selectedLocationIndices.has(location.address) ? 'Unselect' : 'Select' }}
            </button>
          </ng-template>

          <p>{{ location.address }}</p>
          <p>{{ location.phoneNumber }}</p>
          <p>{{ location.distance }}</p>
          <p>{{ location.duration }}</p>
        </nz-collapse-panel>
      </nz-collapse>
    </div>
  </div>
</div>
