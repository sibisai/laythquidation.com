<div class="location-selection-container">
  <div class="map-container">
    <div id="map"></div>
  </div>

  <div class="locations-overlay-container">
    <div class="header-container">
      <h1 class="location-header">Selected Locations: {{ selectedLocationsCount }}</h1>

      <nz-space *ngIf="!loading && selectedLocationsCount > 0" class="header-buttons">
        <button nz-button nzType="default" (click)="clearAllSelections()">Clear All</button>
        <button nz-button nzType="primary" (click)="submitSelections()" [nzLoading]="loading">Generate Route</button>
      </nz-space>
      
      <!-- Progress bar shown during route generation -->
      <nz-progress *ngIf="loading" nzSize="small" [nzPercent]="progress" [nzStatus]="progress === 100 ? 'success' : 'active'"
        [nzFormat]="progress === 100 ? formatDone : undefined" style="width: 100%; display: block; padding-right: 12px;">
      </nz-progress>
      <nz-divider class="custom-divider"></nz-divider>
    <div class="location-cards-container">
      <div class="filter-container">
        <nz-input-group [nzSuffix]="inputClearTpl">
          <input type="text" nz-input nzBorderless placeholder="Search locations" [(ngModel)]="searchTerm"
            (input)="filterLocations()" />
        </nz-input-group>
        <ng-template #inputClearTpl>
          <span *ngIf="searchTerm" nz-icon nzType="close-circle" nzTheme="fill" (click)="clearSearch()"></span>
        </ng-template>
      </div>

      <!-- Accordion with ghost mode -->
      <nz-collapse nzAccordion nzGhost>
        <nz-collapse-panel *ngFor="let location of paginatedLocations; let i = index"
          [nzHeader]="(currentPage - 1) * pageSize + i + 1 + '. ' + location.storeName" [nzActive]="false"
          [ngClass]="{'selected-accordion': selectedLocationIndices.has((currentPage - 1) * pageSize + i)}"
          [nzExtra]="extraTemplate">

          <!-- Button template inside the panel -->
          <ng-template #extraTemplate>
            <button nz-button nzType="primary"
              [nzDanger]="selectedLocationIndices.has((currentPage - 1) * pageSize + i)"
              (click)="toggleSelection(location, i)">
              {{ selectedLocationIndices.has((currentPage - 1) * pageSize + i) ? 'Unselect' : 'Select' }}
            </button>
          </ng-template>

          <p>{{ location.address }}</p>
          <p>{{ location.phoneNumber }}</p>
          <p>{{ location.distance }}</p>
          <p>{{ location.duration }}</p>
        </nz-collapse-panel>
      </nz-collapse>
    </div>

  </div>
  <div class="pagination-container">
    <div class="pagination-info">
      {{ (currentPage - 1) * pageSize + 1 }}-{{ getMinValue(currentPage * pageSize, totalLocations) }} of {{
      totalLocations }} items
    </div>
    <nz-pagination [(nzPageIndex)]="currentPage" [nzTotal]="totalLocations" [nzPageSize]="pageSize"
      [nzShowSizeChanger]="true" [nzPageSizeOptions]="pageSizeOptions" [nzSize]="'small'"
      (nzPageIndexChange)="onPageIndexChange($event)" (nzPageSizeChange)="onPageSizeChange($event)">
    </nz-pagination>
  </div>
</div>
